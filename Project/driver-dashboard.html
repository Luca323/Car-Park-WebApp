<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Park Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <button class="menu-toggle" onclick="toggleMenu()">☰ Menu</button>
    <nav id = "nav">
        <a href="#">Dashboard</a>
        <a href="#">Make a Booking</a>
        <a href="#">My Bookings</a>
        <a href="#">Logout</a>
      </nav>

      <div class="dashboard">
        <div class="section">
          <h2>Hello, [User]</h2>
        </div>
      
        <div class="section">
          <h3>Current Bookings</h2>
        </div>
      
        <div class="section">
          <h3>Recent Booking History</h2>
          <p>View all your past bookings and receipts by clicking below.</p>
          <a href="#" class="btn">View History</a>
        </div>
      </div>
      
      <script>
        function toggleMenu() {
          var nav = document.getElementById("nav");
          nav.classList.toggle("show");
        }
      </script>
</body>
</html>
